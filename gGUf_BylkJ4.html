<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(#0b1d3a, #1c3f6e); color: #fff;
    font-family: Georgia, "Times New Roman", serif; overflow: hidden;
  }
  h1 { margin: 0 0 6px; font-size: 2rem; }
  .hint { opacity: .85; margin-top: 14px; transition: opacity .4s; }

  .scene { position: relative; width: 220px; height: 220px; margin-top: 70px; cursor: pointer; }
  .box { position: absolute; bottom: 0; left: 10px; width: 200px; height: 130px;
         background: #c0392b; border-radius: 6px; z-index: 3; }
  .box::after { content: ""; position: absolute; left: 90px; top: 0; width: 20px; height: 100%; background: #f1c40f; }
  .lid { position: absolute; bottom: 130px; left: 0; width: 220px; height: 44px;
         background: #e74c3c; border-radius: 6px; z-index: 4;
         transform-origin: left bottom; transition: transform .9s ease; }
  .lid::after { content: ""; position: absolute; left: 100px; top: 0; width: 20px; height: 100%; background: #f1c40f; }
  .scene.open .lid { transform: rotate(-75deg) translateX(-10px); }

  .letter {
    position: absolute; left: 20px; bottom: 20px; width: 180px; min-height: 120px;
    background: #fffdf5; color: #3b2a1a; border-radius: 4px; padding: 14px 10px;
    z-index: 2; opacity: 0; transform: translateY(0) scale(.6);
    transition: transform 1.1s ease .6s, opacity .5s ease .6s;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .scene.open .letter { opacity: 1; transform: translateY(-200px) scale(1.55); z-index: 5; }
  .letter small { display: block; font-size: .6rem; }
  .letter .to { font-size: .75rem; margin-bottom: 6px; }
  .letter .name { font-size: 1.35rem; font-weight: bold; color: #c0392b; margin: 6px 0; word-break: break-word; }

  .flake { position: fixed; top: -20px; color: #fff; pointer-events: none;
           animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh); } }
</style>
</head>
<body>
  <h1>Secret Santa</h1>
  <p id="greeting"></p>

  <div class="scene" id="scene">
    <div class="letter">
      <small class="to" id="to"></small>
      <small>Letos obdaruješ:</small>
      <div class="name" id="receiver"></div>
      <small>🤫</small>
    </div>
    <div class="box"></div>
    <div class="lid"></div>
  </div>
  <p class="hint" id="hint">Pritisni na darilo, če te zanima, koga letos obdaruješ!</p>

<script>
  const DATA = "Fqp97byRJMP0xEnc7fr4yf4451N6HwSu+JLe0S3TFBd1uwEwXTjyZE2XiMPlUlSUAdcRinj2GB1XG9LsK9sja6NsaA==";
  const b64 = s => Uint8Array.from(
    atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

  (async function () {
    try {
      const raw = b64(DATA);
      const key = await crypto.subtle.importKey(
        "raw", b64(location.hash.slice(1)), "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
      const info = JSON.parse(new TextDecoder().decode(plain));
      document.getElementById("greeting").textContent = "Živjo " + info.giver + "!";
      document.getElementById("to").textContent = "dragi" + info.giver + ",";
      document.getElementById("receiver").textContent = info.receiver;
    } catch (e) {
      console.error(e);
      document.getElementById("greeting").textContent = e.name + ": " + e.message;
      document.getElementById("greeting").textContent =
        "This link is incomplete. Please use the full link from your email." + key;
      document.getElementById("scene").style.display = "none";
      document.getElementById("hint").style.display = "none";
    }
  })();


  document.getElementById("scene").addEventListener("click", function () {
    this.classList.add("open");
    document.getElementById("hint").style.opacity = 0;
  });

  for (let i = 0; i < 40; i++) {
    const f = document.createElement("div");
    f.className = "flake";
    f.textContent = "❄";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = (10 + Math.random() * 16) + "px";
    f.style.animationDuration = (5 + Math.random() * 8) + "s";
    f.style.animationDelay = (-Math.random() * 10) + "s";
    document.body.appendChild(f);
  }
</script>
</body>
</html>
